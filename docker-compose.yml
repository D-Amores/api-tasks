services:
  db:
    image: pgvector/pgvector:pg16
    container_name: api-tasks-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp:
    build: .
    container_name: api-tasks-mcp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8001:8001"
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uv run python -m app.mcp_server

  api:
    build: .
    container_name: api-tasks-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MCP_SERVER_URL: http://localhost:8001/mcp
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"
    network_mode: "service:mcp"

  web:
    build:
      context: ../tasks-web
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: api-tasks-web
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  postgres_data:
